[package]
name = "hexlords"
description = "A hex map strategy game foundation: the Rust port of the hexGame engine demo, on Turbo Ferret and miniquad."
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "Zlib"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "hexlords"
path = "src/main.rs"

# Runtime dependencies are these three and nothing else (see CLAUDE.md).
[dependencies]
miniquad = { workspace = true }
turbo-ferret = { workspace = true }
turbo-ferret-miniquad = { workspace = true }

# The game is the root package; the tools are members (`cargo run -p mapeditor`,
# `cargo run -p assetgen --release`, `cargo run -p mapgen`).
[workspace]
members = ["tools/assetgen", "tools/mapeditor", "tools/mapgen"]

[workspace.dependencies]
miniquad = "=0.4.11" # the version turbo-ferret-miniquad is built against
turbo-ferret = { git = "https://github.com/sstanfield/turbo-ferret", rev = "a37cb83" }
turbo-ferret-miniquad = { git = "https://github.com/sstanfield/turbo-ferret", rev = "a37cb83" }

# The tests make many random maps (mapgen), all arithmetic: built a little
# optimized, they run in seconds, not minutes. (Builds for running the game
# are as they were.)
[profile.test]
opt-level = 1

# The tile generator is all arithmetic: a test draws every tile again to
# compare it with the ones in `assets/tiles`, which unoptimized takes a minute.
[profile.dev.package.assetgen]
opt-level = 3
